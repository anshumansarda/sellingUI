<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#efece6" />
  <title>Carrousel — a curated collection</title>
  <meta name="description" content="A curated collection of clothes, bags, watches and accessories, displayed like a real store." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="data/catalog.js"></script>
</head>
<body data-cat="clothes">
  <header class="top">
    <a class="logo" href="#/clothes" aria-label="Carrousel home">
      <span class="logo-word">Carrousel</span>
      <span class="logo-sub">a curated collection</span>
    </a>
    <button id="bagBtn" class="bag-btn" aria-label="Bag" data-noloop>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l-1 12.5a1 1 0 0 1-1 .9H8a1 1 0 0 1-1-.9L6 8Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span id="bagCount" class="badge" hidden>0</span>
    </button>
  </header>

  <main id="scenes" class="scenes"></main>

  <div class="hint" aria-hidden="true"><span class="hint-desk">Scroll or drag to browse · click to look closer</span><span class="hint-phone">Swipe to browse · tap to look closer</span></div>

  <nav class="switch" aria-label="Departments" data-noloop>
    <div class="seg" role="tablist"></div>
  </nav>

  <!-- quick look: the piece comes off the display -->
  <div id="quick" class="quick" aria-hidden="true" role="dialog" aria-label="Quick look">
    <div class="quick-scrim" data-close-quick></div>
    <button class="q-x x" data-close-quick aria-label="Close">×</button>
    <button class="q-arrow prev" data-quick-prev aria-label="Previous piece">‹</button>
    <div id="quickHero" class="quick-hero"></div>
    <button class="q-arrow next" data-quick-next aria-label="Next piece">›</button>
    <div id="quickCard" class="quick-card"></div>
  </div>

  <!-- product page -->
  <article id="pdp" class="pdp" aria-hidden="true"></article>

  <!-- bag -->
  <div class="bag-scrim"></div>
  <aside id="bagPanel" class="bag-panel" aria-hidden="true" aria-label="Your bag">
    <div class="bp-view bp-bag">
      <div class="bp-head"><h3>Your bag</h3><button class="x" data-close-bag aria-label="Close bag">×</button></div>
      <div id="bagList" class="bag-list"></div>
      <div id="bagFoot" class="bag-foot">
        <div class="bf-total"><span>Subtotal</span><b id="bagTotal"></b></div>
        <p id="bagNote" class="bf-note"></p>
        <button id="checkoutBtn" class="btn-primary">Checkout</button>
      </div>
    </div>
    <div class="bp-view bp-checkout">
      <div class="bp-head"><button id="checkoutBack" class="bp-back" aria-label="Back to bag">←</button><h3>Checkout</h3><button class="x" data-close-bag aria-label="Close">×</button></div>
      <p class="co-intro">Carrousel curates; each house ships its own pieces. Complete each item on the maker's site — your selection, size and quantity are listed for you.</p>
      <div id="checkoutList" class="co-list"></div>
    </div>
  </aside>

  <script src="js/data.js"></script>
  <script src="js/loop.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/ui.js"></script>
  <script>CR.ui.init();</script>
</body>
</html>
